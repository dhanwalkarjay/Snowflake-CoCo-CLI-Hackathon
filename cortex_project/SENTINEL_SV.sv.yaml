name: SENTINEL_SV
description: 'Banking fraud, AML and regulatory reporting copilot. Covers customers,
  accounts, transactions, loans, liquidity, alerts and detection rules. IMPORTANT:
  RAW.FRAUD_TRUTH is excluded - never expose ground truth labels.'
