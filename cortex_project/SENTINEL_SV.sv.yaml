relationships:
  - name: ALERTS_TO_DIM_ACCOUNTS
    left_table: ALERTS
    right_table: DIM_ACCOUNTS
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: ENTITY_ID
        right_column: ACCOUNT_ID
  - name: ALERTS_TO_RULES
    left_table: ALERTS
    right_table: RULES
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: RULE_ID
        right_column: RULE_ID
  - name: DIM_ACCOUNTS_TO_DIM_CUSTOMERS
    left_table: DIM_ACCOUNTS
    right_table: DIM_CUSTOMERS
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
  - name: FACT_LOANS_TO_DIM_ACCOUNTS
    left_table: FACT_LOANS
    right_table: DIM_ACCOUNTS
    join_type: inner
    relationship_type: one_to_one
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - name: FACT_TRANSACTIONS_TO_DIM_ACCOUNTS
    left_table: FACT_TRANSACTIONS
    right_table: DIM_ACCOUNTS
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
verified_queries:
  - name: 0;1
    question: Which accounts have the highest structuring alert scores?
    sql: SELECT a.ENTITY_ID AS ACCOUNT_ID, a.SCORE, a.REASON FROM alerts AS a WHERE
      a.ALERT_TYPE = 'STRUCTURING' ORDER BY a.SCORE DESC LIMIT 10
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What is the weekly alert volume for each detection rule?
    sql: SELECT r.RULE_NAME, DATE_TRUNC('WEEK', a.CREATED_AT) AS WEEK, COUNT(*) AS
      ALERT_COUNT FROM alerts AS a JOIN rules AS r ON a.RULE_ID = r.RULE_ID GROUP
      BY r.RULE_NAME, WEEK ORDER BY WEEK, ALERT_COUNT DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What is the non-performing asset ratio by city?
    sql: SELECT c.CITY, COUNT(CASE WHEN l.DPD > 90 THEN 1 END) AS NPA_COUNT, COUNT(*)
      AS TOTAL_LOANS, ROUND(COUNT(CASE WHEN l.DPD > 90 THEN 1 END) * 100.0 / COUNT(*),
      2) AS NPA_RATIO_PCT FROM fact_loans AS l JOIN dim_accounts AS ac ON l.ACCOUNT_ID
      = ac.ACCOUNT_ID JOIN dim_customers AS c ON ac.CUSTOMER_ID = c.CUSTOMER_ID GROUP
      BY c.CITY ORDER BY NPA_RATIO_PCT DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What was the lowest liquidity coverage ratio on each day when it fell
      below the required threshold?
    sql: SELECT REPORTING_DATE, MIN(LCR_RATIO) AS MIN_LCR FROM fact_liquidity WHERE
      LCR_BREACH = TRUE GROUP BY REPORTING_DATE ORDER BY REPORTING_DATE
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What are the cash deposits just under 10 lakh in the last 30 days?
    sql: SELECT TXN_ID, ACCOUNT_ID, AMOUNT, TXN_DATE FROM fact_transactions WHERE
      TXN_METHOD = 'CASH' AND TXN_TYPE = 'CREDIT' AND AMOUNT BETWEEN 800000 AND 999999
      AND TXN_DATE >= DATEADD(DAY, -30, CURRENT_DATE) ORDER BY AMOUNT DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 5;1
    question: How many open alerts are there by severity level?
    sql: SELECT SEVERITY, COUNT(*) AS ALERT_COUNT FROM alerts WHERE STATUS = 'OPEN'
      GROUP BY SEVERITY ORDER BY CASE SEVERITY WHEN 'CRITICAL' THEN 1 WHEN 'HIGH'
      THEN 2 WHEN 'MEDIUM' THEN 3 WHEN 'LOW' THEN 4 END
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 6;1
    question: What is the total transaction volume by payment method?
    sql: SELECT TXN_METHOD, COUNT(*) AS TXN_COUNT, SUM(AMOUNT) AS TOTAL_VOLUME FROM
      fact_transactions GROUP BY TXN_METHOD ORDER BY TOTAL_VOLUME DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 7;1
    question: Which high-risk customers have the most open alerts and what are their
      average alert scores?
    sql: SELECT c.CUSTOMER_ID, c.FULL_NAME, c.RISK_RATING, COUNT(a.ALERT_ID) AS ALERT_COUNT,
      ROUND(AVG(a.SCORE), 3) AS AVG_SCORE FROM dim_customers AS c JOIN dim_accounts
      AS ac ON c.CUSTOMER_ID = ac.CUSTOMER_ID JOIN alerts AS a ON a.ENTITY_ID = ac.ACCOUNT_ID
      WHERE c.RISK_RATING IN ('HIGH', 'PEP', 'SANCTIONED') AND a.STATUS = 'OPEN' GROUP
      BY c.CUSTOMER_ID, c.FULL_NAME, c.RISK_RATING ORDER BY ALERT_COUNT DESC LIMIT
      20
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 8;1
    question: Which dormant accounts have had significant transaction activity in
      the past week?
    sql: SELECT ac.ACCOUNT_ID, ac.STATUS, COUNT(t.TXN_ID) AS RECENT_TXNS, SUM(t.AMOUNT)
      AS TOTAL_AMOUNT FROM dim_accounts AS ac JOIN fact_transactions AS t ON ac.ACCOUNT_ID
      = t.ACCOUNT_ID WHERE ac.STATUS = 'DORMANT' AND t.TXN_DATE >= DATEADD(DAY, -7,
      CURRENT_DATE) GROUP BY ac.ACCOUNT_ID, ac.STATUS HAVING COUNT(t.TXN_ID) >= 5
      ORDER BY RECENT_TXNS DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 9;1
    question: What is the average alert score by alert type?
    sql: SELECT ALERT_TYPE, COUNT(*) AS ALERT_COUNT, ROUND(AVG(SCORE), 3) AS AVG_SCORE,
      ROUND(MIN(SCORE), 3) AS MIN_SCORE, ROUND(MAX(SCORE), 3) AS MAX_SCORE FROM alerts
      GROUP BY ALERT_TYPE ORDER BY AVG_SCORE DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 10;1
    question: What is the distribution of loan count and total exposure across different
      SMA categories?
    sql: SELECT SMA_CATEGORY, COUNT(*) AS LOAN_COUNT, SUM(OUTSTANDING_BALANCE) AS
      TOTAL_EXPOSURE FROM fact_loans WHERE NOT SMA_CATEGORY IS NULL GROUP BY SMA_CATEGORY
      ORDER BY SMA_CATEGORY
    verified_at: 1790947637
    verified_by: Semantic Model Generator
  - name: 11;1
    question: What is the cross-border transaction volume by country?
    sql: SELECT t.COUNTERPARTY_COUNTRY, COUNT(*) AS TXN_COUNT, SUM(t.AMOUNT) AS TOTAL_VOLUME
      FROM fact_transactions AS t WHERE t.IS_CROSS_BORDER = TRUE GROUP BY t.COUNTERPARTY_COUNTRY
      ORDER BY TOTAL_VOLUME DESC
    verified_at: 1790947637
    verified_by: Semantic Model Generator
